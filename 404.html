<title>PaulaSulek</title>

<style>
/* Layout: matchday sports app. A deep pitch-green header band carries the day; white score-cards below hold macros, meals and training; bottom tabs on phones, slim rail on desktop. */
:root {
  --bg: #EEF3FA; --bg2: #FFFFFF; --bg3: #F4F7FC; --bg4: #DFE7F3;
  --line: #DCE4F0; --line2: #C3D0E3;
  --fg: #0A1830; --fg2: #47587A; --fg3: #7A88A3;
  --lime: #1F6FEB; --lime-ink: #1858C4; --on-lime: #FFFFFF; --lime-soft: rgba(31,111,235,.10); --lime-line: rgba(31,111,235,.38);
  --pitch: #0B2A5B; --pitch2: #123C7E; --on-pitch: #FFFFFF; --mint: #8EC5FF;
  --ok: #10A04E; --warn: #C27400; --bad: #D33434; --info: #2363D1; --carb: #18A0C9; --fat: #F2A33A;
  --shadow: 0 8px 28px rgba(10,30,70,.10);
  --display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Barlow', system-ui, sans-serif;
  --r: 12px; --r2: 18px;
  --art-bg: #EAF0F8; --plate: #FFFFFF; --plate-in: #F6F8FB; --fig: #2C3B57; --fig-far: #A6B3C9; --equip: #98A6BD;
  color-scheme: light;
}
:root.dark {
  --bg: #07101F; --bg2: #0E1A2E; --bg3: #13213A; --bg4: #1D2E4C;
  --line: #1C2B45; --line2: #2A3D60;
  --fg: #E7EEFA; --fg2: #A4B3CE; --fg3: #6D7E9C;
  --lime: #4C8DFF; --lime-ink: #7DAEFF; --on-lime: #FFFFFF; --lime-soft: rgba(76,141,255,.12); --lime-line: rgba(76,141,255,.4);
  --pitch: #0D2752; --pitch2: #16387A; --on-pitch: #FFFFFF; --mint: #8EC5FF;
  --ok: #4CD98A; --warn: #FFB547; --bad: #FF6B6B; --info: #7DB2FF; --carb: #4CC6EA; --fat: #FFB85C;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --art-bg: #13223A; --plate: #E9ECF2; --plate-in: #F5F7FA; --fig: #C9D4E8; --fig-far: #5D6E8C; --equip: #4A5A78;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--lime-ink); }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; letter-spacing: -.01em; line-height: 1.02; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 12.5px; font-weight: 700; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; }
.muted { color: var(--fg2); } .dim { color: var(--fg3); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.lime { color: var(--lime-ink); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 22px; }
.logo { display: flex; align-items: baseline; gap: 8px; padding: 0 8px; }
.logo b { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .02em; color: var(--fg); }
.logo i { width: 9px; height: 9px; background: var(--lime); display: inline-block; transform: skewX(-12deg); }
.logo span { font-size: 13px; font-weight: 700; color: var(--lime-ink); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border: 0; background: none; border-radius: var(--r); color: var(--fg2); cursor: pointer; text-align: left; font-weight: 550; position: relative; }
.nav button:hover { background: var(--bg3); color: var(--fg); }
.nav button.on { color: var(--fg); background: var(--bg3); }
.nav button.on::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; background: var(--lime); }
.nav svg { width: 18px; height: 18px; flex: none; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.savebadge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.sync { background: var(--info); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1220px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
@media (min-width: 900px) { .main { padding-left: 36px; padding-right: 36px; } }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.head .sub { margin-top: 6px; color: var(--fg2); }

.tabbar, .fab { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding-block: 18px 110px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { border: 0; background: none; color: var(--fg3); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; padding: 6px 0; cursor: pointer; font-weight: 600; }
  .tabbar button.on { color: var(--fg); }
  .tabbar button.on svg { color: var(--lime-ink); }
  .tabbar svg { width: 21px; height: 21px; }
  .tabbar .tb-log { color: var(--on-lime); }
  .tabbar .tb-log span.pl { width: 46px; height: 34px; border-radius: 9px; background: var(--lime); display: grid; place-items: center; margin-top: -2px; }
  .tabbar .tb-log svg { color: var(--on-lime) !important; }
}

/* ---------- surfaces ---------- */
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r2); padding: 20px; min-width: 0; }
.card.flush { padding: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h .eyebrow { margin-bottom: 2px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .g2, .g3 { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .g4 { grid-template-columns: 1fr 1fr; } }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.s4 { gap: 4px; } .stack.s16 { gap: 16px; }
.sep { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.grow { flex: 1; min-width: 0; }

/* ---------- metrics ---------- */
.big { font-family: var(--display); font-weight: 750; font-size: 40px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--fg3); letter-spacing: 0; margin-left: 4px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-family: var(--mono); font-size: 12px; color: var(--fg3); font-weight: 500; margin-left: 3px; }
.bar { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--lime); border-radius: 3px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.over > i { background: var(--warn); }
.bar.c2 > i { background: var(--info); } .bar.c3 > i { background: var(--fg2); }
.ring { position: relative; width: 168px; height: 168px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.macro-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.macro-row .num { font-size: 12px; color: var(--fg2); white-space: nowrap; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg3); color: var(--fg); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: var(--bg4); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.pri { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn.pri:hover { box-shadow: 0 0 0 4px var(--lime-soft); background: var(--lime); }
.btn.ghost { background: none; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { background: var(--bg3); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 48px; padding: 0 20px; font-size: 16px; }
.btn.icon { width: 38px; padding: 0; border-radius: 50%; } .btn.sm.icon { width: 30px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }
.seg { display: inline-flex; background: var(--bg3); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--fg2); padding: 6px 13px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--bg2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line2); }
:root:not(.dark) .seg button.on { background: var(--pitch); color: var(--on-pitch); box-shadow: none; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--fg2); font-weight: 600; }
.input, select.input, textarea.input { height: 40px; width: 100%; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--bg); color: var(--fg); min-width: 0; }
textarea.input { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.input:focus { border-color: var(--lime-line); outline: none; box-shadow: 0 0 0 3px var(--lime-soft); }
.input.num { text-align: right; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg); color: var(--fg2); font-size: 13px; cursor: pointer; font-weight: 550; }
.chip.on { border-color: var(--lime-line); background: var(--lime-soft); color: var(--fg); }
.chip.no { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.chip svg { width: 12px; height: 12px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--fg2); white-space: nowrap; }
.tag.lime { border-color: var(--lime-line); color: var(--lime-ink); }
.tag.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.tag.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
.tag.ok { border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); }
.tag.info { border-color: color-mix(in srgb, var(--info) 50%, transparent); color: var(--info); }
.check { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--line2); background: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; color: transparent; padding: 0; }
.check svg { width: 15px; height: 15px; }
.check.on { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.toggle { position: relative; width: 40px; height: 22px; border-radius: 11px; background: var(--bg4); border: 1px solid var(--line2); cursor: pointer; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg3); transition: transform .2s, background .2s; }
.toggle.on { background: var(--lime-soft); border-color: var(--lime-line); }
.toggle.on::after { transform: translateX(18px); background: var(--lime); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 600; }
.meal { border: 1px solid var(--line); border-radius: var(--r2); background: var(--bg2); }
.meal.done { border-color: var(--lime-line); }
.meal-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.meal-b { padding: 0 16px 14px 54px; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 560px) { .meal-b { padding-left: 16px; } }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; min-width: 0; }
.item .nm { flex: 1; min-width: 0; }
.macros { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 12px; color: var(--fg2); }
.macros b { color: var(--fg); font-weight: 600; }
.est { font-family: var(--mono); font-size: 10px; color: var(--warn); letter-spacing: .05em; }
.empty { border: 1px dashed var(--line2); border-radius: var(--r2); padding: 22px; text-align: center; color: var(--fg2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 28px; height: 28px; color: var(--fg3); }
.note { font-size: 13px; color: var(--fg2); border-left: 2px solid var(--line2); padding: 2px 0 2px 12px; }
.note.lime { border-color: var(--lime); }
.note.warn { border-color: var(--warn); }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 700; color: var(--fg3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wday { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px; background: var(--bg2); display: flex; flex-direction: column; gap: 6px; min-height: 92px; cursor: pointer; text-align: left; min-width: 0; color: var(--fg); }
.wday:hover { border-color: var(--line2); }
.wday.today { border-color: var(--lime-line); box-shadow: inset 0 0 0 1px var(--lime-line); }
.wday .d { font-family: var(--mono); font-size: 11px; color: var(--fg3); }
.wday .w { font-weight: 700; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.wday .st { margin-top: auto; }
@media (max-width: 640px) { .week { grid-template-columns: repeat(7, 1fr); gap: 3px; } .wday { padding: 7px 4px; min-height: 76px; } .wday .w { font-size: 11px; } .wday .st .tag { font-size: 8px; padding: 1px 3px; } }

/* ---------- heatmap ---------- */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--bg4); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--lime) 25%, var(--bg4)); }
.heat i.l2 { background: color-mix(in srgb, var(--lime) 50%, var(--bg4)); }
.heat i.l3 { background: color-mix(in srgb, var(--lime) 78%, var(--bg4)); }
.heat i.l4 { background: var(--lime); }
.heat i.x { background: transparent; border: 1px dashed var(--line); }
.heat i.t { outline: 1.5px solid var(--fg); outline-offset: 1px; }

/* ---------- charts ---------- */
.chart { width: 100%; min-height: 180px; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--fg3); font-family: var(--mono); font-size: 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 8px; font-size: 12px; font-family: var(--mono); white-space: nowrap; box-shadow: var(--shadow); z-index: 5; }

/* ---------- modal & sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .15s; }
.modal { background: var(--bg2); border: 1px solid var(--line2); border-radius: 12px; width: min(620px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column; box-shadow: var(--shadow); animation: rise .2s cubic-bezier(.2,.8,.2,1); }
.modal.wide { width: min(900px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-b { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .scrim { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
@media (max-width: 860px) { .toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.toast { background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r2); padding: 12px 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: rise .2s; font-size: 14px; }
.toast .grow { min-width: 0; }

/* ---------- live workout ---------- */
.live { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; }
.live-top { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }

.wo-stats { display: flex; gap: 18px; font-size: 14px; color: var(--fg2); }
.wo-stats b { color: var(--fg); font-size: 17px; font-family: var(--display); }
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.mission { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg3); color: var(--fg); font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; min-width: 0; }
.mission span.grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mission .tk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; flex: none; color: transparent; }
.mission .tk svg { width: 13px; height: 13px; }
.mission.done { background: var(--lime-soft); border-color: var(--lime-line); }
.mission.done .tk { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.mission[disabled] { cursor: default; }
.chal, .chals .chal { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg3); min-width: 180px; flex: 1; font-size: 13px; }
.chal .bar { height: 5px; }
.chal.done { border-color: var(--lime-line); background: var(--lime-soft); }
.chals { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.qa.qa8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
@media (max-width: 1100px) { .qa.qa8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 860px) { .quick-desk { display: none; } }
.season { background: var(--pitch); color: var(--on-pitch); border-radius: 22px; padding: 22px 24px; }
.season-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.season-lv { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; margin: 4px 0; }
.season-gw { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; color: var(--mint); font-weight: 700; }
.season-gw b { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--on-pitch); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.badge { display: flex; flex-direction: column; gap: 3px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line2); opacity: .55; font-size: 13px; }
.badge.on { opacity: 1; border-style: solid; border-color: var(--lime-line); background: var(--lime-soft); }
.badge-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--bg4); display: grid; place-items: center; }
.badge.on .badge-ic { background: var(--lime); color: var(--on-lime); }
.badge-ic svg { width: 16px; height: 16px; }
.tabs-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; flex-wrap: nowrap; }
.tabs-scroll .seg { flex-wrap: nowrap; flex: none; }
.btn.fav { color: var(--fg3); } .btn.fav.on { color: var(--warn); }
.fab { display: none; }
@media (max-width: 860px) {
  .fab { display: grid; place-items: center; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--lime); color: var(--on-lime); z-index: 45; box-shadow: 0 8px 24px rgba(20,80,200,.35); cursor: pointer; }
  .fab svg { width: 26px; height: 26px; }
  .tabbar { grid-template-columns: repeat(5, 1fr); }
  .band { padding: 18px; border-radius: 18px; }
  .band h1 { font-size: 30px; }
  .mp-a .btn { flex: 1 1 auto; }
}

.wp-meal { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.wp-meal:first-child { border-top: 0; padding-top: 4px; }
.wp-items { list-style: none; margin: 0; padding: 8px 12px; background: var(--bg3); border-radius: 12px; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; }
.wp-items li { display: flex; justify-content: space-between; gap: 10px; }
.wp-items li span:first-child { font-weight: 600; }
.wp-items li span:last-child { font-size: 13px; white-space: nowrap; }
.logo { align-items: center; }
.logo-img { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: none; }
.onb .logo-img { width: 40px; height: 40px; }
.logo b { font-size: 22px; letter-spacing: 0; }

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const fmtDate = (k, o = {}) => { const d = pd(k); return `${o.wd ? WD3[d.getDay()] + ', ' : ''}${MON[d.getMonth()]} ${d.getDate()}${o.y ? ', ' + d.getFullYear() : ''}`; };
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(d.getMinutes())} ${ap}`; };
const fmtHM = hm => { if (!hm || !hm.includes(':')) return hm || ''; let [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`; };
const fmtN = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(round(v, d)).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rng = seed => { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };

// Paula's own weekly plan, exact grams (scale 1)
function paulaWeek() { const out = {}, fa = S.profile?.fasting; for (const [wd, ids0] of Object.entries(PAULA_WEEK)) { const ids = fa?.enabled && fa.days.includes(+wd) && PAULA_FAST_WEEK[wd] ? PAULA_FAST_WEEK[wd] : ids0; out[wd] = {}; ['breakfast','lunch','snack','dinner'].forEach((s, i) => out[wd][s] = { m: ids[i], s: 1 }); } return out; }

const getDay = k => S.days[k] || (S.days[k] = { d: k, meals: [], water: 0, steps: null, sleep: null, energy: null, hunger: null, sore: null, rhr: null, rest: false, act: [], hab: {}, planEdits: {}, notes: '' });

// ---------- persistence ----------
// Buckets let a month of logs save as one document.
const STATIC_BUCKETS = ['profile','foods','meals','plan','program','reminders','measurements','active','exercises'];
function bucketValue(b) {
  if (b.startsWith('days-')) { const p = b.slice(5); return Object.fromEntries(Object.entries(S.days).filter(([k]) => k.startsWith(p))); }
  if (b.startsWith('workouts-')) { const p = b.slice(9); return S.workouts.filter(w => w.date.startsWith(p)); }
  return S[b];
}
function applyBucket(b, v) {
  if (b.startsWith('days-')) { const p = b.slice(5); for (const k of Object.keys(S.days)) if (k.startsWith(p)) delete S.days[k]; Object.assign(S.days, v || {}); return; }
  if (b.startsWith('workouts-')) { const p = b.slice(9); S.workouts = S.workouts.filter(w => !w.date.startsWith(p)).concat(v || []); S.workouts.sort((a, b) => a.start - b.start); return; }
  if (STATIC_BUCKETS.includes(b)) S[b] = v;
}
const dayBucket = k => 'days-' + k.slice(0, 7);
const woBucket = k => 'workouts-' + k.slice(0, 7);

const Store = {
  idb: null, local: 'none', cloud: 'off', db: null, uid: null, pending: new Set(), timer: null, lastSave: null, unsub: null,
  async openIDB() {
    try {
      if (!('indexedDB' in window)) throw 0;
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('forge', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv', { keyPath: 'k' }); d.createObjectStore('photos', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej('timeout'), 4000);
      });
      this.local = 'idb';
    } catch { this.idb = null; this.local = 'none'; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.idb) return rej('no idb');
      try { const t = this.idb.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); } catch (e) { rej(e); }
    });
  },
  async loadLocal() {
    if (!this.idb) return false;
    try {
      const rows = await new Promise((res, rej) => { const t = this.idb.transaction('kv', 'readonly'); const q = t.objectStore('kv').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
      if (!rows.length) return false;
      for (const r of rows) {
        if (r.k === '__pending') { (r.v || []).forEach(b => this.pending.add(b)); continue; }
        try { applyBucket(r.k, r.v); S.meta[r.k] = r.u || 0; } catch (e) { console.warn('Skipped corrupted bucket', r.k); }
      }
      return true;
    } catch { return false; }
  },
  async writeLocal(b) {
    if (!this.idb) return;
    try { await this.tx('kv', 'readwrite', s => s.put({ k: b, u: S.meta[b] || 0, v: deep(bucketValue(b) ?? null) })); } catch (e) { console.warn('local write failed', e); }
  },
  async writePending() { if (this.idb) try { await this.tx('kv', 'readwrite', s => s.put({ k: '__pending', u: 0, v: [...this.pending] })); } catch {} },
  save(...buckets) {
    const now = Date.now();
    for (const b of buckets) { S.meta[b] = now; this.writeLocal(b); this.pending.add(b); }
    this.lastSave = now; this.writePending(); this.schedulePush(); updateSaveBadge();
  },
  saveAll() { this.save(...this.allBuckets()); },
  allBuckets() {
    const set = new Set([...STATIC_BUCKETS, ...Object.keys(S.meta).filter(b => b.startsWith('days-') || b.startsWith('workouts-'))]);
    Object.keys(S.days).forEach(k => set.add(dayBucket(k)));
    S.workouts.forEach(w => set.add(woBucket(w.date)));
    return [...set];
  },
  schedulePush() { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1200); },
  async push() {
    if (!this.db || !this.uid || !S.profile?.sync) return;
    const list = [...this.pending]; if (!list.length) return;
    this.cloud = 'syncing'; updateSaveBadge();
    let failed = false;
    for (const b of list) {
      try {
        const j = JSON.stringify(bucketValue(b) ?? null);
        if (j.length > 240000) throw { code: 'too_large' };
        await this.db.doc(`data/users/${this.uid}/${b}`).set({ u: S.meta[b] || 0, j });
        this.pending.delete(b);
      } catch (e) {
        failed = true;
        if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'invalid_argument')) { this.cloud = 'readonly'; break; }
      }
    }
    this.writePending();
    if (this.cloud !== 'readonly') this.cloud = failed ? 'error' : 'synced';
    if (failed && this.cloud === 'error') setTimeout(() => this.push(), 20000);
    updateSaveBadge();
  },
  async connectCloud() {
    try {
      const cl = window.claude; if (!cl || !cl.use) { this.cloud = 'unavailable'; return false; }
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) { this.cloud = 'unavailable'; return false; }
      const id = await user.id(); if (!id) { this.cloud = 'unavailable'; return false; }
      this.db = db; this.uid = id;
      if (!S.profile?.sync) { this.cloud = 'off'; return true; }
      await this.pull();
      this.subscribe();
      return true;
    } catch (e) { this.cloud = 'error'; return false; }
  },
  async pull() {
    this.cloud = 'syncing'; updateSaveBadge();
    const snap = await this.db.collection(`data/users/${this.uid}`).get();
    let changed = false;
    const remote = new Set();
    for (const d of snap.docs) {
      if (d.id.startsWith('photo-')) continue;
      const body = d.data() || {}; remote.add(d.id);
      if ((body.u || 0) > (S.meta[d.id] || 0)) {
        try { applyBucket(d.id, JSON.parse(body.j)); S.meta[d.id] = body.u; this.writeLocal(d.id); this.pending.delete(d.id); changed = true; } catch { console.warn('Skipped unreadable cloud bucket', d.id); }
      } else if ((body.u || 0) < (S.meta[d.id] || 0)) this.pending.add(d.id);
    }
    // anything the user changed locally that the account doesn't have yet
    for (const b of this.allBuckets()) if (!remote.has(b) && (S.meta[b] || 0) > 0) this.pending.add(b);
    this.cloud = 'synced';
    await this.push();
    return changed;
  },
  subscribe() {
    if (this.unsub || !this.db) return;
    try {
      this.unsub = this.db.collection(`data/users/${this.uid}`).onSnapshot(snap => {
        let changed = false;
        for (const ch of snap.docChanges()) {
          if (ch.type === 'removed' || ch.doc.id.startsWith('photo-')) continue;
          const body = ch.doc.data() || {};
          if ((body.u || 0) > (S.meta[ch.doc.id] || 0)) {
            try { applyBucket(ch.doc.id, JSON.parse(body.j)); S.meta[ch.doc.id] = body.u; this.writeLocal(ch.doc.id); changed = true; } catch {}
          }
        }
        if (changed) softRender();
      }, () => { this.unsub = null; });
    } catch {}
  },
  async clearCloud() {
    if (!this.db || !this.uid) return;
    const snap = await this.db.collection(`data/users/${this.uid}`).get();
    for (const d of snap.docs) { try { await this.db.doc(`data/users/${this.uid}/${d.id}`).delete(); } catch {} }
  },
  async clearLocal() { if (this.idb) { await this.tx('kv', 'readwrite', s => s.clear()); await this.tx('photos', 'readwrite', s => s.clear()); } },
  // photos: kept on this device and in the private per-user account store (one document per photo)
  async photos() {
    const out = new Map();
    if (this.idb) await new Promise(res => { try { const q = this.idb.transaction('photos').objectStore('photos').getAll(); q.onsuccess = () => { q.result.forEach(p => out.set(p.id, p)); res(); }; q.onerror = () => res(); } catch { res(); } });
    if (this.db && this.uid) { try { const snap = await this.db.collection(`data/users/${this.uid}`).get(); for (const d of snap.docs) if (d.id.startsWith('photo-')) { const b = d.data(); if (b?.src && !out.has(b.id)) out.set(b.id, b); } } catch {} }

  return g ? `${fmtAmt(it.a * g)} g ${nm} (${fmtAmt(it.a)} ${it.u})` : `${fmtAmt(it.a)} ${it.u} ${nm}`;
}

// ---------- units (stored in kg; shown in kg or lb) ----------
const LB = 2.20462;
const isLb = () => S.profile?.units === 'imperial';
const wUnit = () => isLb() ? 'lb' : 'kg';
const toDispW = kg => kg == null || kg === '' ? kg : isLb() ? round(+kg * LB, 1) : +kg;
const fromDispW = v => v === '' || v == null || isNaN(+v) ? v : isLb() ? round(+v / LB, 3) : +v;
const fmtW = (kg, d = 1) => kg == null ? '—' : `${fmtN(toDispW(kg), d)} ${wUnit()}`;

// ---------- raw vs cooked ----------
function foodState(f) { if (!f) return null; if (f.st) return f.st; if (/\bcooked|grilled|boiled|baked|fried|roasted\b/i.test(f.n)) return 'cooked'; if (/\braw|dry\b/i.test(f.n)) return 'raw'; return null; }

// ---------- training phase ----------
function programWeek(k = today()) { const st = S.profile.startDate || k; return Math.max(1, Math.floor(daysBetween(st, k) / 7) + 1); }
function programPhase(k = today()) {
  const w = programWeek(k);
  if (w <= 2) return { w, name: 'Re-entry', tip: 'Learn the movements again. Stop 2–3 reps before failure.' };
  if (w % 8 === 0) return { w, name: 'Deload', tip: 'Same exercises, about half the sets. Recover and come back stronger.' };
  if (w <= 10) return { w, name: 'Build', tip: 'Push most working sets to 0–2 reps in reserve. Add reps first, then weight.' };
  return { w, name: 'Progress', tip: 'Beat last session by a rep or a little weight on your main lifts.' };
}

// ---------- points & levels (transparent, rewards healthy behaviour only) ----------
const POINT_RULES = [
  ['Each planned meal logged', 5, 'up to 20 a day'],
  ['Protein target reached (≥95%)', 15, 'once a day'],
  ['Calories within ±10% of target', 15, 'eating far less gives 0, never extra'],
  ['Planned workout completed', 25, 'max one per day; extra sessions earn nothing'],
  ['Planned rest day', 25, 'rest earns the same as training'],
  ['Water target reached', 5, ''],
  ['Steps target reached', 10, ''],
  ['Slept 7+ hours', 10, 'recovery is part of the plan'],
  ['Morning weigh-in', 5, ''],
];
function dayPoints(k) {
  const d = peekDay(k), t = targets(), tot = dayTotals(k), out = [];
  const add = (label, pts, done) => out.push({ label, pts: done ? pts : 0, max: pts, done });
  if (k < (S.profile.startDate || k) || k > today()) return { total: 0, items: [] };
  const planned = SLOTS.filter(s => planFor(k)[s]);
  const mealsDone = planned.filter(s => d?.meals.some(m => m.planSlot === s)).length;
  add(`Meals logged (${mealsDone}/${planned.length})`, mealsDone * 5, mealsDone > 0); out[out.length - 1].max = planned.length * 5;
  add('Protein target', 15, tot.n && tot.p >= t.p * 0.95);
  add('Calories on target', 15, tot.n && Math.abs(tot.k / t.k - 1) <= 0.1);
  const st = sessionStatus(k), sch = scheduleFor(k);
  if (sch.type === 'workout' && !sch.opt) add('Workout', 25, st === 'done');
  else if (st === 'done') add('Workout', 25, true);
  else add('Rest day', 25, k < today() || nowHM() >= 12);
  add('Water', 5, (d?.water || 0) >= t.w);
  add('Steps', 10, d?.steps != null && d.steps >= stepsTarget(k));
  add('Sleep 7h+', 10, d?.sleep != null && d.sleep >= 7);
  add('Weigh-in', 5, S.measurements.some(m => m.date === k && m.kg != null));
  return { total: sum(out.map(x => x.pts)), max: sum(out.map(x => x.max)), items: out };
}
function weekPoints(ws) { let s = 0; for (let i = 0; i < 7; i++) { const k = addD(ws, i); if (k > today()) break; s += dayPoints(k).total; } return s; }
function levelFor(pts) { let lv = 1, need = 300, acc = 0; while (pts >= acc + need) { acc += need; lv++; need = 300 + (lv - 1) * 100; } return { lv, into: pts - acc, need }; }
function weeklyChallenges(ws = weekStart(today())) {
  const days = []; for (let i = 0; i < 7; i++) days.push(addD(ws, i));
  const past = days.filter(k => k <= today()), t = targets();
  const pDays = past.filter(k => dayTotals(k).n && dayTotals(k).p >= t.p * 0.95).length;
  const planned = plannedSessions(ws, addD(ws, 6)).filter(p => !p.s.opt), doneS = planned.filter(p => workoutsOn(p.k).length).length;
  const weighs = new Set(S.measurements.filter(m => m.kg != null && days.includes(m.date)).map(m => m.date)).size;
  const sl = past.map(k => peekDay(k)?.sleep).filter(x => x != null);
  return [
    { id: 'protein', label: 'Hit protein on 5 days', now: pDays, goal: 5, pts: 40 },
    { id: 'sessions', label: `Complete all ${planned.length} planned sessions`, now: doneS, goal: Math.max(1, planned.length), pts: 50 },
    { id: 'weigh', label: 'Weigh in 3 mornings', now: weighs, goal: 3, pts: 25 },
    { id: 'sleep', label: 'Average 7h sleep (log 4+ nights)', now: sl.length >= 4 ? round(avg(sl), 1) : 0, goal: 7, pts: 25, unit: 'h' },
  ].map(c => ({ ...c, done: c.now >= c.goal }));
}
function weekTotalWithChallenges(ws) { return weekPoints(ws) + sum(weeklyChallenges(ws).filter(c => c.done).map(c => c.pts)); }
function seasonTotal() { const st = S.profile.startDate || today(); let s = 0; for (let w = weekStart(st); w <= today(); w = addD(w, 7)) s += weekTotalWithChallenges(w); return s; }
const BADGES = [
  ['first_wo', 'First session', 'Complete your first workout', () => doneWorkouts().filter(w => !w.sample).length >= 1],
  ['ten_wo', '10 sessions', 'Complete 10 workouts', () => doneWorkouts().filter(w => !w.sample).length >= 10],

  ['first_pr', 'New best', 'Set your first personal record', () => prList(999).some(p => !p.sample)],
  ['gw300', 'Big gameweek', 'Score 600+ points in one week', () => { for (let w = weekStart(S.profile.startDate || today()); w <= today(); w = addD(w, 7)) if (weekTotalWithChallenges(w) >= 600) return true; return false; }],
  ['streak7', '7-day streak', '7 good days in a row', () => habitStreaks().longest >= 7],

  ['down2', 'Trend down 2 kg', 'Weekly average down 2 kg from your first week', () => { const ws = weights(false); if (ws.length < 6) return false; const a = weekAvg(ws, addD(ws[0].date, 6)), b = weekAvg(ws, today()); return a && b && a.v - b.v >= 2; }],
];

// ---------- backup validation (pure, testable) ----------
function validateBackup(j) {
  const errs = [];
  if (!j || typeof j !== 'object') return { ok: false, errs: ['Not a JSON object.'] };
  if (j.app !== 'FORGE') errs.push('This file is not a FORGE backup.');
  if (!j.data || typeof j.data !== 'object') errs.push('Missing data section.');
  if (errs.length) return { ok: false, errs };
  const d = j.data, clean = {};
  for (const [b, v] of Object.entries(d)) {
    if (b.startsWith('days-')) { if (v && typeof v === 'object') { const days = {}; for (const [k, day] of Object.entries(v)) { if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !day || !Array.isArray(day.meals)) continue; const seen = new Set(); day.meals = day.meals.filter(m => m && typeof m.k === 'number' && !seen.has(m.id) && seen.add(m.id)); days[k] = day; } clean[b] = days; } }
    else if (b.startsWith('workouts-')) { if (Array.isArray(v)) { const seen = new Set(); clean[b] = v.filter(w => w && w.id && w.date && Array.isArray(w.ex) && !seen.has(w.id) && seen.add(w.id)); } }
    else if (b === 'measurements') { if (Array.isArray(v)) { const seen = new Set(); clean[b] = v.filter(m => m && m.date && !seen.has(m.id) && seen.add(m.id)); } }
    else if (STATIC_BUCKETS.includes(b)) clean[b] = v;
  }
  return { ok: true, errs, data: clean };
}

function repairLateEntries() {
  const ds = dayStart(); let moved = 0;
  for (const [k, d] of Object.entries(S.days)) {
    const keep = [];
    for (const m of d.meals || []) {
      const t = m.t ? new Date(m.t) : null;
      if (t && dk(t) === k && t.getHours() < ds) {
        const prev = getDay(addD(k, -1));
        if (m.planSlot && prev.meals.some(x => x.planSlot === m.planSlot)) delete m.planSlot;
        prev.meals.push(m); moved++;
      } else keep.push(m);
    }
    d.meals = keep;
  }
  return moved;
}

function mealArt(items, size = 120, label = '') {
  const list = (items || []).filter(i => F(i.f)).map(i => ({ id: i.f, k: itemNut(i).k, f: F(i.f) }));
  const rest = list.filter(x => x.f.cat === 'restaurant');
  const side = list.filter(x => SIDE_IDS.has(x.id) || x.f.cat === 'fruit').sort((a, b) => b.k - a.k).slice(0, 2);
  const plate = list.filter(x => !rest.includes(x) && !side.includes(x)).sort((a, b) => b.k - a.k).slice(0, 4);
  let g = `<rect width="160" height="120" rx="18" fill="var(--art-bg)"/>`;
  if (rest.length && !plate.length) {

    if (rest.length > 1 || plate.length) g += `<g transform="translate(112 54) scale(.44)">${foodComp(rest[1]?.id || plate[0].id)}</g>`;
  } else if (plate.length === 1 && BOWL_IDS.has(plate[0].id)) {
    g += `<g transform="translate(14 8) scale(1.0)">${foodComp(plate[0].id)}</g>`;
  } else if (plate.length) {
    g += `<circle cx="66" cy="62" r="52" fill="var(--plate)" /><circle cx="66" cy="62" r="42" fill="var(--plate-in)"/>`;
    const slots = plate.length === 1 ? [[66, 62, .78]] : plate.length === 2 ? [[48, 60, .56], [84, 64, .56]] : plate.length === 3 ? [[48, 50, .5], [84, 52, .5], [66, 82, .5]] : [[46, 46, .44], [84, 46, .44], [48, 80, .44], [84, 80, .44]];

    if (rest[0]) side.unshift(rest[0]);

const LEN = { T: 44, UA: 26, FA: 24, TH: 36, SH: 34 };
const dirA = a => [Math.sin(a * Math.PI / 180), Math.cos(a * Math.PI / 180)];
function ik(S, H, a, b, side) {

}

  const foot = p.footRel ? [hip[0] + p.footRel[0], hip[1] + p.footRel[1]] : p.foot;

function lineSVG(sp, W, H) {
  const all = sp.series.flatMap(s => s.pts.filter(p => p[1] != null));

  const xs = all.map(p => +pd(p[0])), ys = all.map(p => p[1]).concat(sp.target != null ? [sp.target] : []);
  let x0 = sp.x0 ? +pd(sp.x0) : Math.min(...xs), x1 = sp.x1 ? +pd(sp.x1) : Math.max(...xs);
  if (x0 === x1) { x0 -= DAY * 3; x1 += DAY * 3; }
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const L = 44, R = 12, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
  const X = t => L + (t - x0) / (x1 - x0) * iw, Y = v => T + ih - (v - y0) / (y1 - y0) * ih;

  const days = (x1 - x0) / DAY, nlab = Math.max(2, Math.min(6, Math.floor(iw / 80)));

  if (sp.target != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(sp.target)}" y2="${Y(sp.target)}" stroke="var(--fg3)" stroke-dasharray="4 4"/><text x="${W - R}" y="${Y(sp.target) - 5}" text-anchor="end">${esc(sp.targetLabel || 'target')}</text>`;
  for (const s of sp.series) {
    const pts = s.pts.filter(p => p[1] != null).map(p => [X(+pd(p[0])), Y(p[1]), p]);

      if (s.dots) for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${s.color}"><title>${fmtDate(p[2][0])}: ${fmtN(p[2][1], 1)}${sp.unit || ''}</title></circle>`;
    } else {
      for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--bg2)" stroke="${s.color}" stroke-width="1.6"><title>${fmtDate(p[2][0])}: ${fmtN(p[2][1], 2)}${sp.unit || ''}${p[2][2] ? ' · ' + p[2][2] : ''}</title></circle>`;

function barsSVG(sp, W, H) {

}

  }).join('')}</div>`;
}

  <div class="chips">${cats.map(([v, l]) => `<button class="chip ${cat === v ? 'on' : ''}" data-a="foodCat" data-v="${v}">${l}</button>`).join('')}</div>

  <div class="grid g3">${S.meals.map(m => { const n = mealNut(m), blk = mealBlockReason(m); return `<div class="card stack" style="gap:6px">${mealArt(m.items, 200, m.n).replace('class="art"', 'class="art wide"')}<div class="row between nowrap"><b>${esc(m.n)}</b><button class="btn ghost sm icon" data-a="favMeal" data-id="${m.id}" aria-label="Favorite" style="color:${p.favMeals.includes(m.id) ? 'var(--lime-ink)' : 'var(--fg3)'}">${ic('star')}</button></div><div class="tiny dim">${m.slot.map(s => SLOT_LABEL[s]).join(' · ')} · ${m.min} min${m.cook ? ' · cook' : ''}</div>${macroLine(n)}${blk ? `<span class="tiny" style="color:var(--warn)">Not suggested: ${esc(blk)}</span>` : ''}<div class="row" style="margin-top:4px"><button class="btn sm" data-a="mealEdit" data-id="${m.id}">Edit</button></div></div>`; }).join('')}</div>`;

// ================= TRAINING =================
function vTraining() {
  const tab = S.ui.trainTab;
  return `<header class="head"><div><div class="eyebrow">Training</div><h1 style="margin-top:8px">Train</h1></div>
    <div class="row">${seg('trainTab', tab, [['week','This week'],['program','Program'],['history','History'],['library','Exercises']])}<button class="btn pri" data-a="pickWorkout">${ic('play')}Start a workout</button></div></header>
    ${tab === 'week' ? vTrainWeek() : tab === 'program' ? vProgram() : tab === 'history' ? vHistory() : vLibrary(true)}`;
}
function vTrainWeek() {
  const k = today(), ws = S.ui.weekOff ? addD(weekStart(k), 7 * S.ui.weekOff) : weekStart(k);
  const days = [...Array(7)].map((_, i) => addD(ws, i));
  const missed = days.filter(d => sessionStatus(d) === 'missed');
  const sched = S.program.schedule;
  return `<div class="row between"><div class="row"><button class="btn sm icon" data-a="weekOff" data-v="-1" aria-label="Previous week">${ic('chevl')}</button><b>${fmtDate(days[0])} – ${fmtDate(days[6])}</b><button class="btn sm icon" data-a="weekOff" data-v="1" aria-label="Next week">${ic('chev')}</button>${S.ui.weekOff ? '<button class="btn sm ghost" data-a="weekOff" data-v="0">This week</button>' : ''}</div><span class="tiny dim">Tap a day to reschedule it, log an activity, or start that session.</span></div>
  <div class="week">${days.map(d => { const s = scheduleFor(d), st = sessionStatus(d), w = workoutsOn(d)[0]; return `<button class="wday ${d === k ? 'today' : ''}" data-a="dayModal" data-k="${d}"><span class="d">${WD3[wdOf(d)]} ${pd(d).getDate()}</span><span class="w">${w ? esc(w.name) : s.type === 'workout' ? esc(TPL(s.t)?.n || '?') : s.type === 'activity' ? 'Activity' : 'Rest'}${s.opt && !w ? '<span class="dim"> · opt</span>' : ''}${s.override ? '<span class="lime"> •</span>' : ''}</span><span class="st">${tagFor(st)}</span></button>`; }).join('')}</div>
  ${missed.length ? `<section class="card"><div class="card-h"><div><div class="eyebrow">Missed this week</div><h2>${missed.length} session${missed.length > 1 ? 's' : ''} not done</h2></div></div>
    <p class="small muted" style="margin:0 0 10px">No need to cram it into tomorrow. Pick what fits: do it on a free day, or let it go and continue the plan.</p>
    <div class="list">${missed.map(d => { const s = scheduleFor(d); return `<div class="li"><span class="grow"><b>${esc(TPL(s.t)?.n)}</b> <span class="dim small">${fmtDate(d, { wd: 1 })}</span></span><button class="btn sm" data-a="moveSession" data-k="${d}">Move to a day</button><button class="btn sm ghost" data-a="skipSession" data-k="${d}">Let it go</button></div>`; }).join('')}</div></section>` : ''}
  <section class="card"><div class="card-h"><div><div class="eyebrow">Default weekly schedule</div><h2>Training days</h2></div><span class="tiny dim">Applies to every week. One-off changes go on the day itself.</span></div>
  <div class="list">${[6, 0, 1, 2, 3, 4, 5].map(wd => { const s = sched[wd] || { type: 'rest' }; return `<div class="li" style="flex-wrap:wrap"><b style="width:96px">${WD[wd]}</b>
    <select class="input" style="width:150px" id="sch-type-${wd}" data-c="schedType" data-wd="${wd}" aria-label="${WD[wd]} type">${opt('workout', 'Workout', s.type)}${opt('rest', 'Rest', s.type)}${opt('activity', 'Activity / sport', s.type)}</select>
    ${s.type === 'workout' ? `<select class="input" style="width:160px" id="sch-t-${wd}" data-c="schedTpl" data-wd="${wd}" aria-label="${WD[wd]} workout">${S.program.templates.map(t => opt(t.id, t.n, s.t)).join('')}</select><label class="row small" style="gap:6px"><input type="checkbox" id="sch-o-${wd}" data-c="schedOpt" data-wd="${wd}" ${s.opt ? 'checked' : ''}>Optional</label>`
      : `<input class="input grow" style="min-width:160px" id="sch-n-${wd}" data-c="schedNote" data-wd="${wd}" value="${esc(s.note || '')}" placeholder="Note (e.g. football, walking)">`}</div>`; }).join('')}</div></section>`;
}
function vProgram() {
  return `<div class="row between"><p class="muted small" style="margin:0;max-width:620px">Editable starting template, not a prescription. Low volume, high effort: take most working sets to 0–2 reps in reserve once you're back in rhythm.</p><button class="btn" data-a="newTemplate">${ic('plus')}New template</button></div>
  <div class="grid g2">${S.program.templates.map(t => `<section class="card"><div class="card-h"><div><div class="eyebrow">~${estDuration(t)} min · ${sum(t.ex.map(e => e.sets))} sets</div><input class="input" style="font-weight:700;font-size:17px;height:36px;margin-top:4px" id="tn-${t.id}" data-c="tplName" data-id="${t.id}" value="${esc(t.n)}" aria-label="Template name"></div>
    <div class="row"><button class="btn sm pri" data-a="startWorkout" data-t="${t.id}">${ic('play')}Start</button><button class="btn ghost sm icon" data-a="dupTemplate" data-id="${t.id}" aria-label="Duplicate">${ic('copy')}</button><button class="btn ghost sm icon danger" data-a="delTemplate" data-id="${t.id}" aria-label="Delete">${ic('trash')}</button></div></div>
    <div class="list">${t.ex.map((e, i) => `<div class="li" style="flex-wrap:wrap;gap:8px"><button class="ex-thumb" data-a="exModal" data-id="${e.x}" aria-label="How to do ${esc(EX(e.x).n)}">${exArt(e.x, 56, { animate: false })}</button><div class="grow" style="min-width:150px"><button class="btn ghost sm" style="padding:0;height:auto;font-weight:650;color:var(--fg)" data-a="exModal" data-id="${e.x}">${esc(EX(e.x).n)}</button><div class="tiny dim">${esc(EX(e.x).pm.join(', '))} · ${esc(EX(e.x).eq)}</div></div>
      <label class="row tiny" style="gap:4px">Sets<input class="input num" style="width:52px;height:32px" type="number" min="1" max="8" id="ts-${t.id}-${i}" data-c="tplEx" data-id="${t.id}" data-i="${i}" data-f="sets" value="${e.sets}"></label>
      <label class="row tiny" style="gap:4px">Reps<input class="input num" style="width:52px;height:32px" type="number" min="1" id="tl-${t.id}-${i}" data-c="tplEx" data-id="${t.id}" data-i="${i}" data-f="lo" value="${e.lo}">–<input class="input num" style="width:52px;height:32px" type="number" min="1" id="th-${t.id}-${i}" data-c="tplEx" data-id="${t.id}" data-i="${i}" data-f="hi" value="${e.hi}"></label>
      <label class="row tiny" style="gap:4px">Rest<input class="input num" style="width:62px;height:32px" type="number" min="15" step="15" id="tr-${t.id}-${i}" data-c="tplEx" data-id="${t.id}" data-i="${i}" data-f="rest" value="${e.rest || (EX(e.x).type === 'Compound' ? S.profile.restCompound : S.profile.restIsolation)}">s</label>
      <div class="row" style="gap:2px"><button class="btn ghost sm icon" data-a="tplMove" data-id="${t.id}" data-i="${i}" data-v="-1" aria-label="Move up">${ic('up')}</button><button class="btn ghost sm icon" data-a="tplMove" data-id="${t.id}" data-i="${i}" data-v="1" aria-label="Move down">${ic('down')}</button><button class="btn ghost sm icon" data-a="tplReplace" data-id="${t.id}" data-i="${i}" aria-label="Replace exercise">${ic('swap')}</button><button class="btn ghost sm icon" data-a="tplRemove" data-id="${t.id}" data-i="${i}" aria-label="Remove">${ic('x')}</button></div></div>`).join('')}</div>
    <button class="btn sm" style="margin-top:10px" data-a="tplAdd" data-id="${t.id}">${ic('plus')}Add exercise</button></section>`).join('')}</div>`;
}
function vHistory() {
  const list = doneWorkouts().slice().reverse();
  if (!list.length) return `<div class="empty">${ic('dumbbell')}<span>Completed workouts appear here with every set you logged.</span><button class="btn pri" data-a="pickWorkout">Start your first workout</button></div>`;
  return `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Workout</th><th class="n">Duration</th><th class="n">Sets</th><th class="n">Volume</th><th class="n">RPE</th><th></th></tr></thead><tbody>
  ${list.map(w => `<tr><td>${fmtDate(w.date, { wd: 1 })}</td><td><b style="font-weight:600">${esc(w.name)}</b>${w.sample ? ' <span class="tag warn">sample</span>' : ''}</td><td class="n">${fmtDur(w.end - w.start)}</td><td class="n">${sessionSets(w)}</td><td class="n">${fmtN(toDispW(sessionVolume(w)))} ${wUnit()}</td><td class="n">${w.rpe ?? '—'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-a="woDetail" data-id="${w.id}">View</button></td></tr>`).join('')}
  </tbody></table></div></section>`;
}

// ================= LIVE WORKOUT =================
function vLive() {
  const a = S.active; if (!a) return '';
  const total = sum(a.ex.map(e => e.sets.length)), done = sum(a.ex.map(e => e.sets.filter(s => s.done).length));
  const exDone = a.ex.filter(e => e.sets.length && e.sets.every(s => s.done)).length;
  const rir = S.profile.trackRIR;
  return `<div class="live" id="live" role="dialog" aria-label="Live workout">
  <div class="live-top"><button class="btn ghost icon" data-a="closeLive" aria-label="Minimize workout">${ic('chevd')}</button>
    <div class="grow" style="min-width:0"><div class="eyebrow">${exDone}/${a.ex.length} exercises · ${done}/${total} sets</div><div style="font-weight:750;font-stretch:112%;font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</div></div>
    <span class="clock" id="liveClock">${fmtDur(Date.now() - a.start)}</span><button class="btn pri" data-a="finishModal">Finish</button></div>
  <div class="live-body"><div class="live-inner">
    ${a.ex.map((e, i) => { const ex = EX(e.x), lp = lastPerf(e.x, a.start), cur = i === a.cur, fin = e.sets.length && e.sets.every(s => s.done);
      return `<section class="exc ${cur ? 'cur' : ''} ${fin && !cur ? 'fin' : ''}" id="exc-${i}">
      <div class="exc-h" data-a="liveCur" data-i="${i}" style="cursor:pointer"><div class="grow" style="min-width:0"><div class="eyebrow">${i + 1} of ${a.ex.length} · ${esc(ex.pm.join(', '))}</div><h3 style="font-size:17px;margin-top:3px">${esc(ex.n)}</h3>
        <div class="small muted" style="margin-top:3px">Target ${e.sets.length} × ${e.lo}–${e.hi}${lp ? ` · Last ${fmtDate(lp.date)}: <span class="mono" style="color:var(--fg)">${lp.sets.map(s => `${fmtKg(s.w)}×${s.r}`).join(', ')}</span>` : ' · No previous log'}</div></div>
        ${cur ? `<div class="live-fig">${exArt(ex, 118)}</div>` : fin ? `<span class="tag ok">Done</span>` : `<span class="tag">${e.sets.filter(s => s.done).length}/${e.sets.length}</span>`}</div>
      ${cur ? `<div class="exc-b">
        <div class="row" style="gap:6px">${ex.video ? `<a class="btn sm" href="${esc(ex.video)}" target="_blank" rel="noopener">${ic('play')}Your video ${ic('ext')}</a>` : `<a class="btn sm" href="${ytLink(ex)}" target="_blank" rel="noopener">${ic('search')}Search demos ${ic('ext')}</a>`}<button class="btn sm ghost" data-a="exModal" data-id="${e.x}">How to</button><button class="btn sm ghost" data-a="liveReplace" data-i="${i}">${ic('swap')}Replace</button></div>
        <div class="setrow ${rir ? '' : 'norir'} sethead"><span>Set</span><span>${wUnit()}</span><span>Reps</span>${rir ? '<span>RIR</span>' : ''}<span></span></div>
        ${e.sets.map((s, j) => `<div class="setrow ${rir ? '' : 'norir'} ${s.done ? 'done' : ''}"><span class="sn">${j + 1}</span>
          <input class="input" type="number" inputmode="decimal" step="0.5" min="0" id="lw-${i}-${j}" data-c="liveSet" data-i="${i}" data-j="${j}" data-f="w" value="${s.w === '' || s.w == null ? '' : toDispW(s.w)}" placeholder="${lp ? fmtKg((lp.sets[j] || lp.sets[0]).w) : wUnit()}" aria-label="Set ${j + 1} weight">
          <input class="input" type="number" inputmode="numeric" min="0" id="lr-${i}-${j}" data-c="liveSet" data-i="${i}" data-j="${j}" data-f="r" value="${s.r ?? ''}" placeholder="${e.lo}–${e.hi}" aria-label="Set ${j + 1} reps">
          ${rir ? `<select class="input" id="lq-${i}-${j}" data-c="liveSet" data-i="${i}" data-j="${j}" data-f="rir" aria-label="Set ${j + 1} reps in reserve">${opt('', '–', s.rir ?? '')}${[0, 1, 2, 3, 4].map(v => opt(v, v === 4 ? '4+' : v, s.rir ?? '')).join('')}</select>` : ''}
          <button class="check ${s.done ? 'on' : ''}" data-a="liveDone" data-i="${i}" data-j="${j}" aria-label="${s.done ? 'Undo' : 'Complete'} set ${j + 1}">${ic('check')}</button></div>
          ${!isLb() && s.w && plates(+s.w, ex.eq) ? `<div class="plates" style="padding-left:42px">${plates(+s.w, ex.eq)}</div>` : ''}`).join('')}
        <div class="row"><button class="btn sm" data-a="liveAddSet" data-i="${i}">${ic('plus')}Add set</button>${e.sets.length > 1 ? `<button class="btn sm ghost" data-a="liveRemoveSet" data-i="${i}">Remove last set</button>` : ''}<span class="grow"></span>${i < a.ex.length - 1 ? `<button class="btn sm" data-a="liveCur" data-i="${i + 1}">Next exercise ${ic('chev')}</button>` : ''}</div>
        <textarea class="input" id="ln-${i}" data-c="liveNote" data-i="${i}" rows="2" placeholder="Notes: seat height, grip, how it felt…" style="min-height:52px">${esc(e.note || '')}</textarea>
      </div>` : ''}</section>`; }).join('')}
    <button class="btn" data-a="liveAddEx">${ic('plus')}Add exercise</button>
    <button class="btn ghost danger" data-a="discardWorkout">Discard workout</button>
  </div></div>
  <div class="restbar ${a.rest ? '' : ''}" id="restbar" ${a.rest ? '' : 'hidden'}><div class="inner"><div class="grow"><div class="eyebrow">Rest</div><span class="clock" id="restClock">${a.rest ? fmtDur(Math.max(0, a.rest.end - Date.now())) : ''}</span></div><button class="btn sm" data-a="restAdj" data-v="-15">−15s</button><button class="btn sm" data-a="restAdj" data-v="15">+15s</button><button class="btn sm pri" data-a="restSkip">Skip</button></div></div>
  </div>`;
}

// ================= LIBRARY =================
function vLibrary(embedded) {
  const f = S.ui.libFilter, q = (f.q || '').toLowerCase();
  const inPlan = id => S.program.templates.filter(t => t.ex.some(e => e.x === id)).map(t => t.n);

  const sel = (key, label, opts) => `<select class="input" id="lib-${key}" data-c="libF" data-f="${key}" aria-label="${label}" style="width:auto;min-width:130px">${opt('', label, f[key] || '')}${opts.map(o => Array.isArray(o) ? opt(o[0], o[1], f[key] || '') : opt(o, o, f[key] || '')).join('')}</select>`;
  return `${embedded ? `<div class="row between"><span class="small muted">${S.exercises.length} exercises with setup, execution, common mistakes and muscle maps.</span><button class="btn" data-a="exEdit">${ic('plus')}Add exercise</button></div>` : `<header class="head"><div><div class="eyebrow">Exercise library</div><h1 style="margin-top:8px">Movements</h1></div><button class="btn" data-a="exEdit">${ic('plus')}Add exercise</button></header>`}
  <div class="row"><input class="input" style="max-width:280px" id="lib-q" data-c="libF" data-f="q" placeholder="Search exercises…" value="${esc(f.q || '')}" aria-label="Search exercises">

   FORGE — views: analytics, habits, reviews, coach, settings, onboarding
   ============================================================ */
function rangeDays(r) { const k = today(), out = []; for (let i = r - 1; i >= 0; i--) out.push(addD(k, -i)); return out; }

function nutStats(days) {
  const t = targets(), logged = days.filter(k => dayTotals(k).n > 0);
  const tots = logged.map(dayTotals);
  let planned = 0, eaten = 0, rest = 0;
  for (const k of logged) { const p = planFor(k), d = peekDay(k); for (const s of SLOTS) if (p[s]) { planned++; if (d.meals.some(m => m.planSlot === s)) eaten++; } rest += d.meals.filter(m => m.src === 'restaurant').length; }
  return {
    logged: logged.length, avgK: avg(tots.map(x => x.k)), avgP: avg(tots.map(x => x.p)),
    inK: tots.filter(x => Math.abs(x.k / t.k - 1) <= 0.1).length, pMet: tots.filter(x => x.p >= t.p * 0.95).length,
    planRate: planned ? eaten / planned : null, rest,
  };
}
function trainStats(days) {
  const from = days[0], to = days[days.length - 1], k = today();
  const ws = doneWorkouts().filter(w => w.date >= from && w.date <= to);
  const planned = plannedSessions(from, to).filter(p => !p.s.opt && p.k <= k);
  const plannedDone = planned.filter(p => workoutsOn(p.k).length).length;
  const missed = planned.filter(p => sessionStatus(p.k) === 'missed');
  const musc = {}; for (const w of ws) for (const e of w.ex) { const n = e.sets.filter(s => s.done).length; for (const m of EX(e.x).pm) musc[m] = (musc[m] || 0) + n; }
  return { ws, planned: planned.length, plannedDone, missed, musc, weeks: days.length / 7 };
}
function prList(limit = 10) {
  const best = {}, out = [];
  for (const w of doneWorkouts()) for (const e of w.ex) for (const s of e.sets) if (s.done && s.w && s.r) {
    const v = e1rm(+s.w, +s.r);
    if (best[e.x] && v > best[e.x] + 0.01) out.push({ date: w.date, x: e.x, w: s.w, r: s.r, e1: v, prev: best[e.x], sample: w.sample });
    if (!best[e.x] || v > best[e.x]) best[e.x] = v;
  }
  return out.reverse().slice(0, limit);
}
function corrNote() {
  const ws = weights(); if (ws.length < 8) return 'Not enough data yet. This needs at least 4 weeks with both meal logs and 3+ weigh-ins per week.';
  const pairs = [];
  for (let i = 1; i <= 12; i++) {
    const end = addD(weekStart(today()), -7 * (i - 1) - 1), prevEnd = addD(end, -7);
    const a = weekAvg(ws, end), b = weekAvg(ws, prevEnd);
    const days = [...Array(7)].map((_, j) => addD(end, -j)), st = nutStats(days);
    if (a && b && st.logged >= 4) pairs.push([st.inK / st.logged, a.v - b.v]);
  }
  if (pairs.length < 4) return `Only ${pairs.length} week${pairs.length === 1 ? '' : 's'} with enough data so far. This view needs at least 4.`;
  const mx = avg(pairs.map(p => p[0])), my = avg(pairs.map(p => p[1]));
  const cov = sum(pairs.map(p => (p[0] - mx) * (p[1] - my))), sx = Math.sqrt(sum(pairs.map(p => (p[0] - mx) ** 2))), sy = Math.sqrt(sum(pairs.map(p => (p[1] - my) ** 2)));
  if (!sx || !sy) return 'Your adherence has been too steady week to week to compare.';
  const r = cov / sx / sy;
  return `Across ${pairs.length} weeks, the correlation between calorie-target days and weekly weight change is r = ${fmtN(r, 2)}${r < -0.3 ? ': weeks closer to target tended to show more loss' : r > 0.3 ? ': an unexpected direction, often logging gaps or water shifts' : ': no clear pattern yet'}. With this few weeks it is a hint, not proof.`;
}

  </div></section>
  <section class="card"><div class="card-h"><div><div class="eyebrow">12 weeks</div><h2>Consistency heatmap</h2></div><span class="tiny dim">Weeks run Saturday → Friday</span></div><div class="heat" role="img" aria-label="Daily consistency heatmap">${cells.join('')}</div>
    <p class="tiny dim" style="margin:10px 0 0">A missed day lowers that day's score only. Streaks pause, the rest of your history stays. Planned rest days count as success.</p></section>
  <section class="card"><div class="card-h"><div><div class="eyebrow">Last 7 days</div><h2>Habit log</h2></div><span class="tiny dim">Tap a cell to set Completed / Partial / Missed / N/A</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Habit</th>${last7.map(d => `<th style="text-align:center">${WD3[wdOf(d)]}<br>${pd(d).getDate()}</th>`).join('')}</tr></thead><tbody>
    ${HABITS.map(([h, l]) => `<tr><td style="white-space:nowrap">${l}</td>${last7.map(d => { const s = habitStatus(d, h), [c, lab] = HSTAT[s], ov = peekDay(d)?.hab?.[h]; return `<td style="text-align:center"><button class="tag ${c}" style="cursor:pointer;background:none;${ov ? 'box-shadow:inset 0 0 0 1px var(--fg3)' : ''}" data-a="cycleHabit" data-k="${d}" data-h="${h}" title="${lab}${ov ? ' (set by you)' : ''}">${s === 'done' ? '✓' : s === 'partial' ? '½' : s === 'skipped' ? '✕' : s === 'na' ? '–' : '·'}</button></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></section>
  <section class="card"><div class="card-h"><div><div class="eyebrow">Earned from your logs</div><h2>Milestones</h2></div></div>${milestones()}</section>`;

function milestones() {
  const real = doneWorkouts().filter(w => !w.sample), n = real.length, st = habitStreaks(), prs = prList(999).filter(p => !p.sample).length;
  const loggedDays = Object.values(S.days).filter(d => !d.sample && d.meals.some(m => !m.sample)).length;
  const ws = weights(false), first = ws.length ? weekAvg(ws, addD(ws[0].date, 6)) : null, now = weekAvg(ws, today());
  const items = [['First workout logged', n >= 1], ['10 workouts', n >= 10], ['25 workouts', n >= 25], ['50 workouts', n >= 50], ['First personal record', prs >= 1], ['7-day streak', st.longest >= 7], ['30-day streak', st.longest >= 30], ['30 days of food logs', loggedDays >= 30],
    ['Weekly average down 2 kg', first && now && first.v - now.v >= 2], ['Weekly average down 5 kg', first && now && first.v - now.v >= 5]];
  return `<div class="chips">${items.map(([l, ok]) => `<span class="chip ${ok ? 'on' : ''}" style="cursor:default">${ok ? ic('check') : ''}${l}</span>`).join('')}</div>`;
}

// ---------- reviews ----------
function buildReview(from, to, label) {
  const days = []; for (let k = from; k <= to && k <= today(); k = addD(k, 1)) days.push(k);
  const t = targets(), ns = nutStats(days), ts = trainStats(days), ws = weights();
  const rec = days.map(peekDay).filter(Boolean);
  const sleepV = rec.map(d => d.sleep).filter(x => x != null), stepsV = rec.map(d => d.steps).filter(x => x != null);
  const wNow = weekAvg(ws, to), wPrev = weekAvg(ws, addD(to, days.length > 8 ? -28 : -7));
  const weighIns = ws.filter(w => w.date >= from && w.date <= to).length;
  const good = [], missed = [], pri = [];
  if (ns.logged) good.push(`Logged food on ${ns.logged} of ${days.length} days.`);
  if (ns.pMet) good.push(`Hit your protein target on ${ns.pMet} day${ns.pMet > 1 ? 's' : ''}.`);
  if (ts.plannedDone) good.push(`Completed ${ts.plannedDone} of ${ts.planned} planned sessions${ts.ws.length > ts.plannedDone ? ` plus ${ts.ws.length - ts.plannedDone} extra` : ''}.`);
  if (stepsV.length && avg(stepsV) >= stepsTarget(to)) good.push(`Averaged ${fmtN(avg(stepsV))} steps, above your ${fmtN(stepsTarget(to))} goal.`);
  if (sleepV.length && avg(sleepV) >= S.profile.sleepTarget) good.push(`Averaged ${fmtN(avg(sleepV), 1)} h sleep.`);
  if (ts.missed.length) missed.push(`${ts.missed.length} planned session${ts.missed.length > 1 ? 's' : ''} missed (${ts.missed.map(m => WD3[wdOf(m.k)]).join(', ')}).`);
  if (days.length - ns.logged > 0) missed.push(`${days.length - ns.logged} day${days.length - ns.logged > 1 ? 's' : ''} without food logs.`);
  if (ns.logged && ns.pMet < ns.logged) missed.push(`Protein was short on ${ns.logged - ns.pMet} logged day${ns.logged - ns.pMet > 1 ? 's' : ''}.`);
  if (weighIns < 3) missed.push(`Only ${weighIns} weigh-in${weighIns === 1 ? '' : 's'}; 3+ per week make the trend reliable.`);
  let weight = 'Not enough weigh-ins to compare weekly averages yet.';
  if (wNow && wPrev) { const ch = wNow.v - wPrev.v; weight = `Weekly average ${fmtW(wNow.v, 1)}, ${ch >= 0 ? '+' : ''}${fmtN(ch, 2)} kg vs ${days.length > 8 ? '4 weeks' : 'the week'} before.`; }
  else if (wNow) weight = `Weekly average ${fmtW(wNow.v, 1)}. A comparison needs a prior week with 3+ weigh-ins.`;
  // adjustment rule: only with 3 weekly averages, never automatic
  let adj = 'No change suggested. Either the trend is moving in the right direction or there is not enough data yet (at least 3 weeks of weekly averages).';
  const w1 = weekAvg(ws, to), w2 = weekAvg(ws, addD(to, -7)), w3 = weekAvg(ws, addD(to, -14));
  if (w1 && w2 && w3) {
    const rate = (w1.v - w3.v) / 2;
    const adherent = ns.logged >= days.length * 0.7 && ns.logged && ns.inK / ns.logged >= 0.6;
    if (rate > -0.1 && adherent) adj = `Your weekly average has been roughly flat for 2 weeks (${rate >= 0 ? '+' : ''}${fmtN(rate, 2)} kg/week) while you mostly hit your calorie target. A modest adjustment may be warranted: about 100–150 kcal less per day, or about 1,500 more daily steps. You decide; PaulaSulek never changes targets on its own.`;
    else if (rate > -0.1) adj = 'The trend is flat, but logging or calorie adherence was inconsistent, so tighten consistency before changing targets.';
    else if (rate < -(w1.v * 0.01)) adj = `You're losing about ${fmtN(-rate, 2)} kg/week, above 1% of body weight. If training performance or energy is dropping, consider adding 100–150 kcal.`;
    else adj = `Losing about ${fmtN(-rate, 2)} kg/week on average. That's a sustainable pace for recomposition; keep going.`;
  }
  if (ns.logged && ns.pMet / ns.logged < 0.6) pri.push(`Protein first: aim for ${t.p} g on 5+ days. A shake or Greek yogurt closes most gaps.`);
  if (ts.planned && ts.plannedDone / ts.planned < 0.75) pri.push('Protect your training slots: lock in the next 3 sessions in your calendar.');
  if (ns.logged < days.length * 0.7) pri.push('Log every meal, even rough restaurant estimates. Consistency of logging matters more than precision.');
  if (sleepV.length && avg(sleepV) < S.profile.sleepTarget - 0.5) pri.push(`Sleep averaged ${fmtN(avg(sleepV), 1)} h. Try a fixed lights-out time 30 minutes earlier.`);
  if (stepsV.length && avg(stepsV) < stepsTarget(to) * 0.8) pri.push(`Steps averaged ${fmtN(avg(stepsV))}; add a 15-minute walk after lunch.`);
  if (weighIns < 3) pri.push('Weigh in at least 3 mornings a week, after the bathroom and before eating.');
  if (!pri.length) pri.push('Keep the same routine; add a rep or a little weight where your last sets hit the top of the range.');
  return { label, from, to, good, missed, weight, nut: ns.logged ? `${ns.logged}/${days.length} days logged · avg ${fmtN(ns.avgK)} kcal and ${fmtN(ns.avgP)} g protein · ${ns.inK} day${ns.inK === 1 ? '' : 's'} within ±10% of ${t.k} kcal.` : 'No food logged in this period.',
    train: ts.planned ? `${ts.plannedDone}/${ts.planned} planned sessions done (${Math.round(ts.plannedDone / ts.planned * 100)}%), ${ts.ws.length} workouts total.` : `${ts.ws.length} workouts; no sessions were planned.`, adj, pri: pri.slice(0, 2) };
}
function reviewHTML(r) {
  const sec = (h, body) => `<div class="stack s4"><div class="eyebrow">${h}</div>${body}</div>`;
  const ul = a => a.length ? `<ul class="plain small">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="small muted" style="margin:0">Nothing to note.</p>';
  return `<section class="card stack s16"><div><div class="eyebrow">${fmtDate(r.from)} – ${fmtDate(r.to)}</div><h2 style="margin-top:4px">${esc(r.label)}</h2></div>
    <div class="grid g2">${sec('What went well', ul(r.good))}${sec('What was missed', ul(r.missed))}</div>
    <div class="grid g3">${sec('Weight trend', `<p class="small" style="margin:0">${esc(r.weight)}</p>`)}${sec('Nutrition consistency', `<p class="small" style="margin:0">${esc(r.nut)}</p>`)}${sec('Training consistency', `<p class="small" style="margin:0">${esc(r.train)}</p>`)}</div>
    ${sec('Adjustments?', `<div class="note ${r.adj.startsWith('Your weekly average has been') ? 'warn' : ''} small">${esc(r.adj)}</div>`)}
    ${sec('Priorities for next period', `<ol class="steps-on small">${r.pri.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`)}</section>`;
}
function vReviews() {
  const off = S.ui.revWeek || 0, ws = addD(weekStart(today()), 7 * off);
  const wk = buildReview(ws, addD(ws, 6), off === 0 ? 'This week so far' : off === -1 ? 'Last week' : `Week of ${fmtDate(ws)}`);
  const mo = buildReview(addD(today(), -29), today(), 'Last 30 days');
  return `<div class="row between"><div class="row"><button class="btn sm icon" data-a="revWeek" data-v="-1" aria-label="Previous week">${ic('chevl')}</button><b>Weekly review</b><button class="btn sm icon" data-a="revWeek" data-v="1" aria-label="Next week" ${off >= 0 ? 'disabled' : ''}>${ic('chev')}</button></div><span class="tiny dim">Your review day: ${WD[S.profile.reviewDay]} · Assumptions: weekly averages need 3+ weigh-ins; adjustments need 3 weeks of trend.</span></div>
  ${reviewHTML(wk)}<h2>Monthly review</h2>${reviewHTML(mo)}`;
}

/* ============================================================
   FORGE — the three systems:
   1. Daily Execution   (vToday)        what to do today, right now
   2. Adaptive Coach    (vCoachHub)     reads many signals, proposes, never auto-changes
   3. Performance       (vPerformance)  is Paula actually progressing?
   ============================================================ */

// ---------------- 1. DAILY EXECUTION ----------------
function nowHM() { return lateHM(); }
const hmNum = s => { const [a, b] = (s || '0:0').split(':').map(Number); const v = a + b / 60; return v < dayStart() ? v + 24 : v; };
function todayTasks(k = today()) {
  const d = getDay(k), plan = planFor(k), sch = scheduleFor(k), st = sessionStatus(k), t = targets(), tasks = [];
  const weighed = S.measurements.some(m => m.date === k && m.kg != null);
  tasks.push({ id: 'weigh', label: 'Morning weigh-in', sub: 'After the bathroom, before food', done: weighed, a: 'weighModal' });
  for (const s of SLOTS) { const pl = plan[s]; if (!pl) continue; const e = d.meals.find(m => m.planSlot === s); tasks.push({ id: s, label: `${SLOT_LABEL[s]} · ${fmtHM(S.profile.mealTimes[s])}`, sub: e ? `${e.name} · eaten ${fmtTime(e.t)}` : pl.name, done: !!e, a: e ? 'undoPlan' : 'eatPlan', slot: s }); }
  if (sch.type === 'workout') tasks.push({ id: 'train', label: `${TPL(sch.t)?.n} · ${fmtHM(S.profile.trainTime)}`, sub: st === 'rest-marked' ? 'Marked as rest' : `${TPL(sch.t)?.ex.length} exercises, ~${estDuration(TPL(sch.t))} min`, done: st === 'done' || st === 'rest-marked', a: st === 'done' ? null : 'startWorkout', t: sch.t });
  else tasks.push({ id: 'train', label: sch.type === 'activity' ? 'Football / padel / walk' : 'Rest day', sub: d.act?.length ? d.act.map(a => `${a.type} ${a.min} min`).join(', ') : 'Recovery counts as training', done: sch.type !== 'activity' || !!d.act?.length, a: 'activityModal' });
  tasks.push({ id: 'water', label: `Water ${fmtN(t.w / 1000, 1)} L`, sub: `${fmtN(d.water / 1000, 2)} L so far`, done: d.water >= t.w, a: 'addWater', v: 500 });
  tasks.push({ id: 'steps', label: `${fmtN(stepsTarget(k))} steps`, sub: d.steps != null ? `${fmtN(d.steps)} logged` : 'Log them tonight', done: d.steps != null && d.steps >= stepsTarget(k), a: 'checkinModal' });
  tasks.push({ id: 'sleep', label: 'Log sleep & energy', sub: d.sleep != null ? `${fmtN(d.sleep, 1)} h · energy ${d.energy ?? '–'}/5` : 'Takes 10 seconds', done: d.sleep != null, a: 'checkinModal' });
  return tasks;
}
// the single most useful thing to do next, with the reason
function nextAction(k = today()) {
  const d = getDay(k), t = targets(), tot = dayTotals(k), h = nowHM(), plan = planFor(k), sch = scheduleFor(k), st = sessionStatus(k);
  if (S.active) return { title: `Finish ${S.active.name}`, why: 'Your sets are saved; pick up where you stopped.', btn: 'Resume workout', a: 'openLive', icon: 'play' };
  const weighed = S.measurements.some(m => m.date === k && m.kg != null);
  if (!weighed && h < 11 && !d.meals.length) return { title: 'Weigh in before breakfast', why: 'Morning weigh-ins on an empty stomach make your weekly trend reliable.', btn: 'Log weight', a: 'weighModal', icon: 'scale' };
  const due = SLOTS.slice().sort((a, b) => hmNum(S.profile.mealTimes[b]) - hmNum(S.profile.mealTimes[a])).find(s => plan[s] && !d.meals.some(m => m.planSlot === s) && h >= hmNum(S.profile.mealTimes[s]) - 0.75);
  if (sch.type === 'workout' && !['done', 'rest-marked'].includes(st) && h >= hmNum(S.profile.trainTime) - 0.5 && h < 23) return { title: `Start ${TPL(sch.t)?.n}`, why: `Planned for ${fmtHM(S.profile.trainTime)}. ${TPL(sch.t)?.ex.length} exercises, about ${estDuration(TPL(sch.t))} minutes.`, btn: 'Start workout', a: 'startWorkout', t: sch.t, icon: 'play' };
  if (due) { const pl = plan[due], n = itemsNut(pl.items); return { title: `${SLOT_LABEL[due]}: ${pl.name}`, why: `${fmtN(n.k)} kcal · ${fmtN(n.p)} g protein.`, items: pl.items, btn: 'I ate this', a: 'eatPlan', slot: due, alt: true, icon: 'food' }; }
  if (h >= 20 && t.p - tot.p > 35) return { title: `${fmtN(t.p - tot.p)} g protein still to go`, why: 'A whey shake (24 g) plus a high-protein yogurt (20 g) closes most of it without many calories.', btn: 'Log food', a: 'logFoodModal', icon: 'bolt' };
  if (d.water < t.w * Math.min(1, Math.max(0, (h - 8) / 13)) - 500) return { title: 'Drink 500 ml of water', why: `You're at ${fmtN(d.water / 1000, 2)} L. Water also helps with hunger.`, btn: '+500 ml', a: 'addWater', v: 500, icon: 'drop' };
  const nextMeal = SLOTS.find(s => plan[s] && !d.meals.some(m => m.planSlot === s));
  if (nextMeal) { const pl = plan[nextMeal]; return { title: `Next: ${SLOT_LABEL[nextMeal]} at ${fmtHM(S.profile.mealTimes[nextMeal])}`, why: `${pl.name}. Here's what to prepare:`, items: pl.items, btn: 'I ate this', a: 'eatPlan', slot: nextMeal, alt: true, icon: 'clock' }; }
  if (d.sleep == null) return { title: 'Log your sleep and energy', why: 'The coach uses sleep, energy and hunger to judge your recovery.', btn: 'Check in', a: 'checkinModal', icon: 'bed' };
  return { title: 'Today is done', why: 'Get 7+ hours of sleep. That is the next workout\'s first rep.', btn: 'See progress', a: 'go', v: 'analytics', icon: 'check' };
}
function macroTile(label, eaten, target, unit, cls) {

  </section>

  <section aria-label="Daily targets"><div class="mts">
