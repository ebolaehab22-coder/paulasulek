  // ---- training schedule ----
  dayModal(el) {
    const k = el.dataset.k, s = scheduleFor(k), st = sessionStatus(k), ws = workoutsOn(k), isT = k === today();
    const cur = S.program.overrides[k] ? (S.program.overrides[k].type === 'workout' ? 'w:' + S.program.overrides[k].t : S.program.overrides[k].type) : 'default';
    openModal(fmtDate(k, { wd: 1, y: 1 }), `<div class="row">${tagFor(st)}<b>${s.type === 'workout' ? esc(TPL(s.t)?.n) : s.type === 'activity' ? 'Activity day' : 'Rest day'}</b>${s.override ? '<span class="tag lime">changed for this date</span>' : ''}</div>
      ${ws.map(w => `<div class="note lime">Completed ${esc(w.name)}: ${sessionSets(w)} sets, ${fmtDur(w.end - w.start)}. <button class="btn sm ghost" data-a="woDetail" data-id="${w.id}">View</button></div>`).join('')}
      <label class="field"><span>Plan for this date only</span><select class="input" id="dm-sel">${opt('default', `Weekly default (${(S.program.schedule[wdOf(k)]?.type === 'workout' ? TPL(S.program.schedule[wdOf(k)].t)?.n : S.program.schedule[wdOf(k)]?.type) || 'rest'})`, cur)}${opt('rest', 'Rest', cur)}${opt('activity', 'Football / activity', cur)}${S.program.templates.map(t => opt('w:' + t.id, t.n, cur)).join('')}</select></label>
      ${(peekDay(k)?.act || []).length ? `<div class="chips">${peekDay(k).act.map(a => `<span class="chip on">${esc(a.type)} · ${a.min} min</span>`).join('')}</div>` : ''}`,
      `${st === 'missed' ? `<button class="btn ghost" data-a="skipSession" data-k="${k}">Let it go</button>` : ''}${k <= today() ? `<button class="btn ghost" data-a="activityModal" data-k="${k}">Log activity</button>` : ''}<span class="grow"></span>${isT && s.type === 'workout' && !ws.length ? `<button class="btn" data-a="startWorkout" data-t="${s.t}">${ic('play')}Start</button>` : ''}<button class="btn pri" data-a="dayModalSave" data-k="${k}">Save</button>`);

  dayModalSave(el) {

  },
  moveSession(el) {
    const k = el.dataset.k, s = scheduleFor(k), opts = [];

    openModal(`Move ${esc(TPL(s.t)?.n)}`, `<p class="small muted" style="margin:0">Choose a day. Days that already have a core session are marked; stacking two hard sessions back to back isn't required.</p><div class="list">${opts.map(o => `<button class="li btn ghost" style="height:auto;justify-content:flex-start" data-a="moveDo" data-d="${o.d}"><span class="grow" style="text-align:left"><b>${o.d === today() ? 'Today' : WD[wdOf(o.d)]}</b> <span class="dim small">${fmtDate(o.d)}</span></span>${o.busy ? `<span class="tag warn">has ${esc(TPL(scheduleFor(o.d).t)?.n)}</span>` : '<span class="tag">free</span>'}</button>`).join('')}</div>`);
  },
  moveDo(el) { const M = window._mv, d = el.dataset.d; S.program.overrides[d] = { type: 'workout', t: M.t, opt: false, note: 'moved' }; S.program.overrides[M.k] = { type: 'rest', note: `Moved to ${WD3[wdOf(d)]}` }; Store.save('program'); closeModal(); render(); toast(`${TPL(M.t).n} moved to ${d === today() ? 'today' : WD[wdOf(d)]}`); },

  newTemplate() { const t = { id: 't_' + uid(), n: 'New workout', ex: [] }; S.program.templates.push(t); Store.save('program'); render(); },

  // ---- live workout ----
  startWorkout(el) {
    const t = TPL(el.dataset.t); closeModal();
    if (!t) { A.pickWorkout(); return; }
    if (S.active) { confirmBox('A workout is already in progress', `${esc(S.active.name)} started ${fmtTime(new Date(S.active.start).toISOString())}. Resume it, or discard it and start ${esc(t.n)}?`, `Discard and start ${esc(t.n)}`, () => { S.active = null; A.startWorkout(el); }); setTimeout(() => { const f = $('#modal .modal-f'); if (f) f.insertAdjacentHTML('afterbegin', `<button class="btn" data-a="openLive">Resume current</button>`); }, 0); return; }
    if (!t.ex.length) { toast('This template has no exercises yet. Add some under Training → Program.'); return; }
    S.active = { id: uid(), tpl: t.id, name: t.n, date: today(), start: Date.now(), cur: 0, rest: null, notes: '',
      ex: t.ex.map(e => { const lp = lastPerf(e.x); return { x: e.x, lo: e.lo, hi: e.hi, rest: e.rest || null, note: '', sets: [...Array(e.sets)].map((_, j) => ({ w: lp ? (lp.sets[j] || lp.sets[lp.sets.length - 1]).w : '', r: '', rir: '', done: false })) }; }) };
    Store.save('active'); S.ui.live = true; render(); unlockAudio();
  },
  openLive() { closeModal(); if (!S.active) return; S.ui.live = true; renderLive(); unlockAudio(); },
  closeLive() { S.ui.live = false; render(); toast('Workout minimized. It keeps running and is saved.'); },
  liveCur(el) { if (!S.active) return; S.active.cur = +el.dataset.i; Store.save('active'); renderLive(); setTimeout(() => document.getElementById('exc-' + S.active.cur)?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 20); },
  liveDone(el) {
    const a = S.active, i = +el.dataset.i, j = +el.dataset.j, e = a.ex[i], s = e.sets[j];
    if (s.done) { s.done = false; delete s.t; Store.save('active'); renderLive(); return; }
    if (s.r === '' || !(+s.r > 0)) { toast('Enter the reps you did first.'); document.getElementById(`lr-${i}-${j}`)?.focus(); return; }
    if (s.w === '' || isNaN(+s.w)) s.w = 0;
    s.done = true; s.t = Date.now();
    const dur = e.rest || (EX(e.x).type === 'Compound' ? S.profile.restCompound : S.profile.restIsolation);
    a.rest = { end: Date.now() + dur * 1000, dur, fired: false };
    if (e.sets.every(x => x.done)) { const nx = a.ex.findIndex((x, ii) => ii > i && !x.sets.every(y => y.done)); if (nx >= 0) a.cur = nx; }
    Store.save('active'); renderLive();
    if (a.cur !== i) setTimeout(() => document.getElementById('exc-' + a.cur)?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30);
  },
  liveAddSet(el) { const e = S.active.ex[+el.dataset.i], last = e.sets[e.sets.length - 1]; e.sets.push({ w: last?.w ?? '', r: '', rir: '', done: false }); Store.save('active'); renderLive(); },
  liveRemoveSet(el) { const e = S.active.ex[+el.dataset.i]; if (e.sets.length > 1) e.sets.pop(); Store.save('active'); renderLive(); },
  liveReplace(el) { const i = +el.dataset.i, e = S.active.ex[i]; exPicker(`Replace ${EX(e.x).n}`, EX(e.x).alt, id => { e.x = id; const lp = lastPerf(id); e.sets.forEach((s, j) => { if (!s.done) s.w = lp ? (lp.sets[j] || lp.sets[0]).w : ''; }); Store.save('active'); renderLive(); }); },
  liveAddEx() { exPicker('Add exercise', [], id => { const lp = lastPerf(id); S.active.ex.push({ x: id, lo: 8, hi: 12, note: '', sets: [0, 1].map(j => ({ w: lp ? (lp.sets[j] || lp.sets[0]).w : '', r: '', rir: '', done: false })) }); S.active.cur = S.active.ex.length - 1; Store.save('active'); renderLive(); }); },
  restAdj(el) { const r = S.active?.rest; if (!r) return; r.end = Math.max(Date.now(), r.end + +el.dataset.v * 1000); r.fired = false; Store.save('active'); tick(); },
  restSkip() { if (S.active) { S.active.rest = null; Store.save('active'); renderLive(); } },
  finishModal() {
    const a = S.active, done = sum(a.ex.map(e => e.sets.filter(s => s.done).length)), pending = sum(a.ex.map(e => e.sets.filter(s => !s.done && +s.r > 0).length));

    openModal('Finish workout', `${!done ? '<div class="note warn">No sets are checked off yet. Check sets as you complete them, or discard this workout.</div>' : `<p class="muted" style="margin:0">${done} set${done === 1 ? '' : 's'} completed in ${fmtDur(Date.now() - a.start)}.</p>`}
      ${pending ? `<div class="note warn">${pending} set${pending > 1 ? 's have' : ' has'} reps entered but not checked. <button class="btn sm" data-a="checkPending">Count ${pending > 1 ? 'them' : 'it'} as done</button></div>` : ''}
      <div class="field"><span>How hard was it overall? (RPE 1–10)</span><div class="seg" id="rpe-seg">${[...Array(10)].map((_, i) => `<button type="button" data-a="rpeSet" data-v="${i + 1}">${i + 1}</button>`).join('')}</div></div>
      <label class="field"><span>Session notes</span><textarea class="input" id="fin-notes" rows="2" placeholder="Energy, sleep, anything to remember next time">${esc(a.notes || '')}</textarea></label>`,

function localCoach(q) {
  const s = q.toLowerCase(), k = today(), t = targets(), tot = dayTotals(k);
  const exMatch = S.exercises.slice().sort((a, b) => b.n.length - a.n.length).find(e => s.includes(e.n.toLowerCase()) || s.includes(e.n.toLowerCase().replace(/ press| machine/g, '')));
  if (/substitut|alternative|replace|instead of/.test(s) && exMatch) {
    const alts = (exMatch.alt || []).map(EX);
    return { text: `Alternatives for ${exMatch.n} (same main muscle: ${exMatch.pm.join(', ')}):\n${alts.map(a => `- ${a.n} (${a.eq})`).join('\n') || '- none listed'}\nIn Training → Program, tap the swap icon next to the exercise to replace it in your template.` };
  }
  if (/last|previous|best/.test(s) && exMatch) {
    const lp = lastPerf(exMatch.id), b = bestE1(exMatch.id);
    return { text: lp ? `Last ${exMatch.n} (${fmtDate(lp.date, { wd: 1 })}${lp.sample ? ', sample data' : ''}):\n${lp.sets.map((x, i) => `- Set ${i + 1}: ${fmtKg(x.w)} ${wUnit()} × ${x.r}`).join('\n')}\nBest estimated 1RM: ${fmtN(b.e1, 1)} kg.` : `No ${exMatch.n} sets logged yet.` };
  }
  if (/miss/.test(s) && /workout|session|train|gym/.test(s)) {
    const nx = (() => { for (let i = 0; i < 8; i++) { const d = addD(k, i), sc = scheduleFor(d); if (sc.type === 'workout' && sessionStatus(d) !== 'done') return { d, sc }; } return null; })();
    return { text: `No need to double up. Simplest options:\n- Continue with your next planned session${nx ? ` (${TPL(nx.sc.t).n}, ${nx.d === k ? 'today' : WD[wdOf(nx.d)]})` : ''}.\n- Or move the missed one to a free day this week: Training → This week → "Move to a day".\n- One missed session doesn't change your progress; consistency over weeks does.` };
  }
  if (/restaurant|ate out|eat out|estimate/.test(s)) return { html: `I can't estimate free-text meals without AI, but the restaurant logger has editable estimates for common Egyptian and fast-food meals.<br><br><button class="btn sm pri" data-a="restaurantModal">Open restaurant logger</button>` };
  if (/summar|month|progress|improv|how am i/.test(s)) {
    const r = buildReview(addD(k, -29), k, 'Last 30 days');
    return { text: `Last 30 days:\n- ${r.weight}\n- Nutrition: ${r.nut}\n- Training: ${r.train}\n${r.good.length ? '- Went well: ' + r.good.join(' ') + '\n' : ''}- Next priority: ${r.pri[0]}${hasSample() ? '\n(Note: sample data is included in these numbers.)' : ''}` };
  }
  if (/eat|meal|food|breakfast|lunch|dinner|snack|hungry|have at home|turkey|chicken|no /.test(s)) {
    const avoid = S.foods.filter(f => new RegExp(`\\b(no|out of|don'?t have|without)\\s+(any\\s+)?${f.n.toLowerCase().split(/[ ,(]/)[0]}`).test(s)).map(f => f.id);
    const slot = ['breakfast','lunch','dinner','snack'].find(x => s.includes(x)) || currentSlot();
    const res = recommend({ slot, where: /uni/.test(s) ? 'uni' : /work/.test(s) ? 'work' : /out|restaurant/.test(s) ? 'out' : 'home', canCook: !/can'?t cook|no cook/.test(s), time: 30, hunger: 'normal', budget: 3, avoid, available: [] });
    const top = res.list.slice(0, 2);
    if (!top.length) return { text: 'Nothing in your meal library fits. Try the "What should I eat?" tab to loosen constraints.' };
    return { text: `${avoid.length ? `Skipping ${avoid.map(id => F(id).n.toLowerCase()).join(', ')}. ` : ''}For ${SLOT_LABEL[slot].toLowerCase()} (you have ${fmtN(Math.max(0, t.k - tot.k))} kcal and ${fmtN(Math.max(0, t.p - tot.p))} g protein left):\n${top.map(r => `- ${r.meal.n}: ${r.items.map(itemLabel).join(', ')} (~${fmtN(r.n.k)} kcal, ${fmtN(r.n.p)} g protein, estimate)`).join('\n')}\nFor more control, open Nutrition → What should I eat?` };
  }
  return { text: 'I can answer from your logs: what to eat, a meal without a certain food, your last lift on an exercise, exercise substitutes, a missed workout, or a 30-day summary. Try one of the suggestions below.' };
}

// ================= REMINDERS =================
function notifState() { try { if (!('Notification' in window)) return 'unsupported'; return Notification.permission; } catch { return 'unsupported'; } }
const fired = new Set(); try { JSON.parse(localStorage.getItem('forge-fired') || '[]').forEach(x => fired.add(x)); } catch {}
function reminderBanners() {
  const k = today(), wd = wdOf(k);
  if (wd === S.profile.reviewDay) return `<div class="banner"><span class="grow"><b>It's review day.</b> See how the week went and pick next week's priorities.</span><button class="btn sm" data-a="go" data-v="analytics" data-tab="review">Weekly review</button></div>`;
  return '';
}
function checkReminders() {
  if (!S.profile?.onboarded) return;
  const now = new Date(), k = today(), wd = now.getDay(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, d = peekDay(k);
  for (const r of S.reminders) {
    if (!r.on) continue;
    let due = false;
    if (r.type === 'water') due = now.getMinutes() === 0 && now.getHours() >= 10 && now.getHours() <= 20 && now.getHours() % 2 === 0 && (d?.water || 0) < S.profile.waterMl;
    else if (r.time === hm) {
      const dayOk = r.days === 'training' ? scheduleFor(k).type === 'workout' && sessionStatus(k) !== 'done' : r.days === 'review' ? wd === S.profile.reviewDay : (r.days || []).includes(wd);
      const skip = (r.type === 'weigh' && S.measurements.some(m => m.date === k && m.kg != null)) || (r.type === 'meals' && (d?.meals.length || 0) >= 3);
      due = dayOk && !skip;
    }
    const key = `${r.id}-${k}-${hm}`;
    if (due && !fired.has(key)) {
      fired.add(key); try { localStorage.setItem('forge-fired', JSON.stringify([...fired].slice(-60))); } catch {}
      toast(`${ic('bell')} ${esc(r.label)}`, { ms: 12000 });
      if (notifState() === 'granted') try { new Notification('PaulaSulek', { body: r.label }); } catch {}
    }
  }
}

// ================= TIMERS =================
let audioCtx = null;
function unlockAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch {} }
function beep() {
  try { if (!audioCtx) return; const t0 = audioCtx.currentTime; for (let i = 0; i < 3; i++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001, t0 + i * 0.25); g.gain.exponentialRampToValueAtTime(0.25, t0 + i * 0.25 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.25 + 0.18); o.start(t0 + i * 0.25); o.stop(t0 + i * 0.25 + 0.2); } } catch {}
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
}
function tick() {
  const a = S.active; if (!a) return;
  const c = document.getElementById('liveClock'); if (c) c.textContent = fmtDur(Date.now() - a.start);
  const bar = document.getElementById('restbar'), rc = document.getElementById('restClock');
  if (a.rest && bar && rc) {
    const left = a.rest.end - Date.now(); bar.hidden = false;
    rc.textContent = left > 0 ? fmtDur(left) : 'Go';
    bar.classList.toggle('done', left <= 0);
    if (left <= 0 && !a.rest.fired) { a.rest.fired = true; beep(); }
    if (left < -8000) { a.rest = null; bar.hidden = true; Store.save('active'); }
  } else if (bar) bar.hidden = true;
}

// ================= EVENTS =================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.getAttribute('type') === 'submit') return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c] && !LIVE_INPUT.has(el.dataset.c)) C[el.dataset.c](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-c]'); if (el && LIVE_INPUT.has(el.dataset.c)) C[el.dataset.c](el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('modal')) closeModal(); });
window.addEventListener('beforeunload', () => { if (Store.pending.size) Store.writePending(); });

// ================= INIT =================
function mergeDefaults(def, val) { if (Array.isArray(def)) return Array.isArray(val) ? val : deep(def); if (def && typeof def === 'object') { const o = { ...(val && typeof val === 'object' ? val : {}) }; for (const k of Object.keys(def)) o[k] = k in o ? mergeDefaults(def[k], o[k]) : deep(def[k]); return o; } return val === undefined ? def : val; }
function personalize() {
  // rebuild around Paula's answers: family-cooked lunches, GUC food, evening training, fasting Wed/Fri with whey
  const p = S.profile, d = SEED_PROFILE;
  p.mealTimes = deep(d.mealTimes); p.trainTime = d.trainTime; p.homeFood = d.homeFood; p.outFood = d.outFood;
  p.lessPreferred = (p.lessPreferred || []).filter(x => !['eggs','egg_white'].includes(x));
  for (const f of d.favorites) if (!p.favorites.includes(f)) p.favorites.push(f);
  p.fasting = deep(d.fasting);
  for (const f of SEED_FOODS) { const ex = S.foods.find(x => x.id === f.id); if (!ex) S.foods.push(deep(f)); else if (ex.src === 'est') ex.n = f.n; }
  S.meals = SEED_MEALS.map(m => ({ ...deep(m), items: m.items.map(i => ({ f: i[0], a: i[1], u: i[2] })) })).concat(S.meals.filter(m => m.custom));
  const r1 = S.reminders.find(r => r.id === 'r1'); if (r1) { r1.time = '18:00'; r1.label = 'Gym tonight: eat your pre-gym snack'; }
  // targets and measurements Paula gave on Oct 26
  for (const key of ['kcal','protein','fat','carbs','waterMl','sleepTarget','activity','slotShare','cheatPerMonth']) p[key] = deep(d[key]);
  p.steps = { ...deep(d.steps), from: p.steps?.from || today() };
  for (const m of SEED_MEASUREMENTS) if (!S.measurements.some(x => x.date === m.date && x.kg != null && !x.sample)) S.measurements.push(deep(m));
  S.plan = paulaWeek();
  p.theme = 'light'; p.pv = 6; S._migrated = true;
}
function normalize() {
  const needV2 = !!S.profile && S.profile.onboarded && (S.profile.pv || 0) < 5;
  const needV6 = !!S.profile && S.profile.pv === 5;
  S.profile = mergeDefaults(SEED_PROFILE, S.profile);
  if (!Array.isArray(S.foods) || !S.foods.length) S.foods = deep(SEED_FOODS);
  const removed = S.profile.removedFoods || [];
  for (const f of SEED_FOODS) { const ex = S.foods.find(x => x.id === f.id); if (!ex && !removed.includes(f.id)) S.foods.push(deep(f)); else if (ex) { if (!ex.ar) ex.ar = f.ar; if (ex.st === undefined) ex.st = f.st; } }
  if (!Array.isArray(S.meals) || !S.meals.length) S.meals = SEED_MEALS.map(m => ({ ...deep(m), items: m.items.map(i => ({ f: i[0], a: i[1], u: i[2] })) }));
  if (!Array.isArray(S.exercises) || !S.exercises.length) S.exercises = deep(SEED_EXERCISES);
  for (const e of SEED_EXERCISES) if (!S.exercises.find(x => x.id === e.id)) S.exercises.push(deep(e));
  if (!S.program?.templates) S.program = { templates: deep(SEED_TEMPLATES), schedule: deep(SEED_SCHEDULE), overrides: {} };
  S.program.overrides = S.program.overrides || {};
  if (!Array.isArray(S.reminders)) S.reminders = deep(SEED_REMINDERS);
  if (!Array.isArray(S.measurements)) S.measurements = [];
  if (!S.days || typeof S.days !== 'object') S.days = {};
  for (const [k, d] of Object.entries(S.days)) { if (!d || !Array.isArray(d.meals)) { delete S.days[k]; continue; } d.hab = d.hab || {}; d.planEdits = d.planEdits || {}; d.act = d.act || []; }
  if (!Array.isArray(S.workouts)) S.workouts = [];
  S.workouts = S.workouts.filter(w => w && w.date && Array.isArray(w.ex)).sort((a, b) => a.start - b.start);
  if (!S.plan || typeof S.plan !== 'object') S.plan = {};
  for (let w = 0; w < 7; w++) if (!S.plan[w]) S.plan[w] = generatePlanDay(w, 1000 + w * 37);
  if (needV2) personalize();
  else if (needV6) { S.profile.theme = 'light'; S.profile.pv = 6; setTimeout(() => Store.save('profile'), 200); }
  if ((S.profile.pv || 0) < 7 && S.profile.onboarded) { S.profile.pv = 7; const n = repairLateEntries(); setTimeout(() => { Store.saveAll(); if (n) toast(`Moved ${n} after-midnight entr${n === 1 ? 'y' : 'ies'} back to yesterday. Your day now ends at ${fmtHM(pad(dayStart()) + ':00')}.`, { ms: 9000 }); }, 300); }
  if (S._migrated) { S._migrated = false; setTimeout(() => { Store.saveAll(); toast('Your weekly plan is loaded with exact grams. Wednesday and Friday are fasting versions with whey.', { ms: 9000 }); }, 300); }
}
async function init() {
  root().innerHTML = '<div class="loading">PAULASULEK · LOADING</div>';
  await Store.openIDB();
  seedState();
  let local = false; try { local = await Store.loadLocal(); } catch {}
  normalize(); applyTheme();
  S._today = today();
  const cloud = Store.connectCloud().then(changed => { normalize(); return changed; });
  // first visit on this device: give the account a moment to answer so onboarding isn't shown twice
  if (!local || !S.profile.onboarded) await Promise.race([cloud, new Promise(r => setTimeout(r, 4500))]);
  render();
  cloud.then(() => { normalize(); softRender(); updateSaveBadge(); if (Store.pending.size) Store.push(); });
  if (S.active) toast(`Workout in progress: ${esc(S.active.name)}. Your sets were saved.`, { action: () => A.openLive(), label: 'Resume', ms: 9000 });
  Coach.init();
  setInterval(tick, 500);
  setInterval(() => {
    if (today() !== S._today) { S._today = today(); S.ui.nutDate = null; S.ui.eat = null; softRender(); toast(`New day started at ${fmtHM(pad(dayStart()) + ':00')}: today\'s log starts fresh.`); }
    checkReminders();
  }, 20000);
  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.profile.theme === 'system' && applyTheme());

init();
